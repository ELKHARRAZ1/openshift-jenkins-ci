services:
  jenkins:
    build: .
    container_name: jenkins-crc
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    # CRC 4.22 en Windows NO usa una IP de VM: publica la API en el
    # loopback del host. Desde el contenedor, 127.0.0.1 seria el propio
    # contenedor, asi que usamos el alias especial host-gateway, que Docker
    # resuelve a la maquina anfitriona.
    extra_hosts:
      - "api.crc.testing:host-gateway"
      - "oauth-openshift.apps-crc.testing:host-gateway"
      - "console-openshift-console.apps-crc.testing:host-gateway"

volumes:
  jenkins_home:
    external: true